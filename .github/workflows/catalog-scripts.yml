name: Catalog collector tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'script_tests/**'
      - 'requirements-scripts.txt'
      - '.python-version'
      - '.github/workflows/catalog-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'script_tests/**'
      - 'requirements-scripts.txt'
      - '.python-version'
      - '.github/workflows/catalog-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collectors:
    name: catalog collectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-scripts.txt
      - run: pip install -r requirements-scripts.txt
      - name: Test collectors without network requests
        run: python -m unittest discover -s script_tests -v
