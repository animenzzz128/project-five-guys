<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team noble-shape</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: Canvas;
      color: CanvasText;
    }
    main { max-width: 32rem; margin: 0 auto; padding: 2.5rem 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; opacity: .75; }
    ul { padding: 0; margin: 0 0 2rem; list-style: none; }
    li { padding: .6rem 0; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    li:last-child { border-bottom: 0; }
    button {
      font: inherit;
      font-size: 1.1rem;
      padding: .75rem 2rem;
      border: 0;
      border-radius: .5rem;
      background: #2f6fde;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #2559b5; }
    .note { margin: 1rem 0 0; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Team noble-shape</h1>
    <p>The people building this app.</p>

    <ul>
      {% for nickname in nicknames %}<li>{{ nickname }}</li>{% endfor %}
    </ul>

    <form method="post" action="{% url 'abtest' %}">
      {% csrf_token %}
      <button id="abtest" type="submit">{{ variant }}</button>
    </form>
    {% if clicked %}<p class="note">Got it, thank you!</p>{% endif %}
  </main>
</body>
</html>
