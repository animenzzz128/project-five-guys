{% extends "core/college_base.html" %}
{% block title %}Remove a college · Admit Compass{% endblock %}
{% block content %}
<section class="shortlist-confirm glass">
  <h1>Remove {{ item.institution.name }}?</h1>
  <p>This removes the college from {{ item.shortlist.name }}.</p>
  <form method="post" action="{% url 'shortlist_remove' item.pk %}">
    {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    <a class="key key-primary" href="{{ next }}">Keep college</a>
    <button class="key" type="submit" name="confirm" value="yes">Confirm removal</button>
  </form>
</section>
{% endblock %}
